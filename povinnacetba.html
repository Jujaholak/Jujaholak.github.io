<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --accent-text: #1d4ed8;
      --success: #10b981;
      --success-soft: #ecfdf5;
      --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
    }

    [data-theme="dark"] {
      --bg: #090d16;
      --surface: #111827;
      --surface-hover: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --accent: #60a5fa;
      --accent-soft: #1e293b;
      --accent-text: #93c5fd;
      --success: #34d399;
      --success-soft: #064e3b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background-color 0.25s, color 0.25s;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 24px 64px;
    }

    /* --- HLAVIČKA --- */
    header {
      padding: 40px 0 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
    }

    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .progress-pill strong {
      color: var(--accent);
    }

    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    .theme-btn:hover {
      border-color: var(--text-muted);
    }

    /* --- OVLÁDACÍ LIŠTA --- */
    .toolbar {
      margin: 28px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 420px;
    }

    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px 10px 38px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .filter-group {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .filter-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    /* --- MŘÍŽKA OKRUHŮ --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .card:hover {
      border-color: var(--accent);
    }

    .card-header {
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .topic-num {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .topic-lit {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      margin-bottom: 4px;
    }

    .topic-lang {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* --- SEZNAM DĚL V KARTĚ --- */
    .books-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .book-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s;
      user-select: none;
    }

    .book-item:hover {
      background-color: var(--surface-hover);
    }

    .book-item.read {
      background-color: var(--success-soft);
    }

    .checkbox {
      width: 18px;
      height: 18px;
      min-width: 18px;
      border-radius: 5px;
      border: 1.5px solid var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: white;
      transition: all 0.15s;
    }

    .book-item.read .checkbox {
      background-color: var(--success);
      border-color: var(--success);
    }

    .book-info {
      display: flex;
      flex-direction: column;
    }

    .book-title {
      font-family: 'Lora', Georgia, serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .book-item.read .book-title {
      text-decoration: line-through;
      opacity: 0.75;
    }

    .book-author {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

    let readBooks = JSON.parse(localStorage.getItem('maturita-read-books') || '[]');
    let currentFilter = 'all';
    let searchQuery = '';

    const grid = document.getElementById('topics-grid');
    const readCounter = document.getElementById('read-counter');
    const searchInput = document.getElementById('search-input');
    const themeToggle = document.getElementById('theme-toggle');

    // Tmavý / světlý režim
    const savedTheme = localStorage.getItem('maturita-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('maturita-theme', theme);
    }
    setTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      setTheme(isDark ? 'light' : 'dark');
    });

    function getBookId(topicNum, bookIndex) {
      return `${topicNum}-${bookIndex}`;
    }

    function toggleBook(bookId) {
      if (readBooks.includes(bookId)) {
        readBooks = readBooks.filter(id => id !== bookId);
      } else {
        readBooks.push(bookId);
      }
      localStorage.setItem('maturita-read-books', JSON.stringify(readBooks));
      render();
    }

    function updateCounter() {
      const totalBooks = MATURITA_DATA.reduce((sum, t) => sum + t.books.length, 0);
      readCounter.textContent = `${readBooks.length} / ${totalBooks}`;
    }

    function render() {
      updateCounter();
      const q = searchQuery.toLowerCase().trim();

      const filteredTopics = MATURITA_DATA.map(topic => {
        const matchingBooks = topic.books
          .map((book, idx) => ({ ...book, id: getBookId(topic.num, idx) }))
          .filter(book => {
            const isRead = readBooks.includes(book.id);
            if (currentFilter === 'read' && !isRead) return false;
            if (currentFilter === 'unread' && isRead) return false;

            if (!q) return true;
            return (
              book.author.toLowerCase().includes(q) ||
              book.title.toLowerCase().includes(q) ||
              topic.lit.toLowerCase().includes(q) ||
              topic.lang.toLowerCase().includes(q) ||
              String(topic.num) === q
            );
          });

        return { ...topic, matchingBooks };
      }).filter(topic => topic.matchingBooks.length > 0);

      if (filteredTopics.length === 0) {
        grid.innerHTML = `<div class="empty-state">Žádná literární díla neodpovídají zadanému filtru.</div>`;
        return;
      }

      grid.innerHTML = filteredTopics.map(topic => `
        <article class="card">
          <div class="card-header">
            <span class="topic-num">Okruh ${topic.num}</span>
            <h2 class="topic-lit">${topic.lit}</h2>
            <p class="topic-lang">${topic.lang}</p>
          </div>
          <ul class="books-list">
            ${topic.matchingBooks.map(book => {
              const isRead = readBooks.includes(book.id);
              return `
                <li class="book-item ${isRead ? 'read' : ''}" onclick="toggleBook('${book.id}')">
                  <div class="checkbox">${isRead ? '✓' : ''}</div>
                  <div class="book-info">
                    <span class="book-title">${book.title}</span>
                    <span class="book-author">${book.author}</span>
                  </div>
                </li>
              `;
            }).join('')}
          </ul>
        </article>
      `).join('');
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    render();
  </script>
</body>
</html>
