  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Můj Osobní Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* --- BAREVNÉ PROMĚNNÉ (Světlý & Tmavý režim) --- */
    :root {
      --bg: #ffffff;
      --bg-secondary: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --tag-bg: #eff6ff;
      --tag-text: #1e40af;
      --code-bg: #f1f5f9;
    }

    [data-theme="dark"] {
      --bg: #0b0f19;
      --bg-secondary: #111827;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --tag-bg: #1e293b;
      --tag-text: #93c5fd;
      --code-bg: #1e293b;
    }

    /* --- ZÁKLADNÍ RESET A TYPOGRAFIE --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 740px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* --- HLAVIČKA --- */
    header {
      padding: 36px 0 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text);
    }

    .theme-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .theme-btn:hover {
      border-color: var(--text-muted);
    }

    /* --- FILTRY A VYHLEDÁVÁNÍ --- */
    .controls {
      margin: 32px 0 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
